tion{font-size:var(--zh-size);line-height:1.78;color:var(--secondary);margin:0 0 21px}.translation[hidden],.study-tools[hidden]{display:none!important}.section-label{font-size:16px;font-weight:700;color:var(--secondary);margin:0 0 12px}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{background:var(--chip);border:1.5px solid var(--chip-border);border-radius:9px;padding:10px 14px;min-height:48px;font-family:Arial,sans-serif;font-size:var(--chip-size);line-height:1.4;font-weight:700;text-align:left}.chip[aria-pressed=true]{background:var(--selected);color:var(--selected-text);border-color:var(--selected)}.definition{background:var(--definition);border-left:3px solid var(--accent);margin-top:14px;padding:17px 19px;border-radius:3px 9px 9px 3px;font-size:var(--detail-size);line-height:1.7}.definition[hidden]{display:none}.definition strong{display:block;margin-bottom:5px}.definition .meaning{font-weight:700}.definition p{margin:7px 0 0}.grammar{margin-top:20px;border-top:1px solid var(--line)}.grammar summary{padding:16px 2px 8px;cursor:pointer;font-size:18px;font-weight:700;list-style:none;display:flex;justify-content:space-between}.grammar summary::-webkit-details-marker{display:none}.grammar summary:after{content:'＋'}.grammar[open] summary:after{content:'−'}.grammar p{margin:4px 0 8px;padding:4px 2px;font-size:var(--detail-size);line-height:1.8;color:var(--secondary)}.closing{margin:34px 0 0;padding:24px 0 0;border-top:1px solid var(--line)}.closing h2{font-size:23px;margin:0 0 10px}.closing p{font-size:var(--detail-size);line-height:1.8;margin:0}footer{font-size:13px;color:var(--secondary);text-align:center;margin-top:26px}.pure .sentence{padding-top:25px;padding-bottom:25px}.pure .english{margin:0}.pure .sentence{border:0}.pure .number{display:none}.pure .sentence:first-child{padding-top:0}.pure .closing{display:none}

.library-return{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:10px 14px;border:1px solid var(--chip-border);border-radius:9px;background:var(--paper);color:var(--ink);font-size:16px;font-weight:700;text-decoration:none}.library-return:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.library-return:hover{border-color:var(--accent)}.library-return-bottom{margin-top:24px;text-align:center}</style></head><body><main class="shell"><div class="reader"><nav aria-label="返回書庫" style="margin:0 0 16px"><a class="library-return" href="../library/">← 返回閱讀書庫</a></nav><header class="top"><div><div class="eyebrow">ENGLISH READING NOTES · 02</div><h1>Cognitive Bias in Decision-Making</h1><div class="subtitle">決策中的認知偏誤 · 逐句精讀</div></div></header><nav class="toolbar" aria-label="閱讀設定"><div class="count">全文 6 句 · 點選字詞查看解析</div><div class="controls"><button class="control" id="smaller" aria-label="縮小字體">A−</button><span class="font-size-label" id="sizeDisplay">25px</span><button class="control" id="larger" aria-label="放大字體">A+</button><button class="control" id="toggleZh" aria-pressed="false">隱藏中文</button><button class="control" id="pure" aria-pressed="false">純英文閱讀</button><button class="control" id="theme" aria-pressed="false">深色模式</button></div></nav><article class="reading-page" id="readingPage"><div id="articles"></div><section class="closing"><h2>全文主旨</h2><p>認知偏誤不是偶發失誤，而是人類思考中反覆出現的系統性偏差。確認偏誤和錨定效應都會影響判斷；即使知道偏誤存在，也未必能避免。因此，需要透過制度、程序與證據建立防護機制。</p></section></article><div class="library-return-bottom"><a class="library-return" href="../library/">← 返回閱讀書庫</a></div><footer>READING NOTES · PERSONAL STUDY EDITION</footer></div></main><script>
const data=[{"en":"Human reasoning, for all its sophistication, remains systematically susceptible to error in ways that defy our self-image as rational agents.","zh":"人類的推理能力儘管十分精密，仍會以某些違背我們自認為理性行動者形象的方式，持續受到錯誤的影響。","words":[["for all its sophistication","儘管它十分精密","for all 在此表示「儘管」，不是「為了所有」。"],["sophistication","複雜精密、成熟程度","此處指人類推理能力的精細程度。"],["systematically","有系統地、反覆呈現規律地","暗示這些錯誤不是偶然，而是具有一定模式。"],["susceptible to","容易受到……影響的","常接疾病、錯誤、誘惑等負面影響。"],["defy","違背、與……不符","defy our self-image 表示與我們對自己的認知相牴觸。"],["rational agents","理性的行動者","指能夠理性判斷、做決定的人。"]],"grammar":"主幹是 Human reasoning remains susceptible to error，表示人類推理仍容易出錯。for all its sophistication 是讓步插入語，意為「儘管十分精密」；that defy... 說明錯誤如何違背我們自認理性的形象。"},{"en":"Cognitive biases are not random lapses but predictable distortions embedded in the architecture of the mind.","zh":"認知偏誤並不是隨機發生的疏失，而是深植於心智運作結構中、可以預測的思考扭曲。","words":[["cognitive biases","認知偏誤","指人們在理解資訊、判斷與決策時反覆出現的系統性偏差。"],["random lapses","偶發的失誤、疏忽","lapse 在這裡是短暫的錯誤或疏失。"],["predictable distortions","可預測的扭曲、偏差","distortion 原指變形，此處指判斷偏離客觀情況。"],["embedded in","深植於、嵌入……之中","表示某種特性已成為整體結構的一部分。"],["the architecture of the mind","心智的運作架構","architecture 在此為比喻，並非建築物。"]],"grammar":"主幹是 Cognitive biases are not A but B，先否定「偶發失誤」，再指出它們是可預測的扭曲。embedded in... 修飾 distortions，強調偏誤深植於思考機制，而非偶然發生。"},{"en":"Confirmation bias, for instance, leads us to seek evidence that corroborates our prior convictions while dismissing what contradicts them.","zh":"例如，確認偏誤會使我們尋找支持既有信念的證據，同時忽略那些與我們信念相矛盾的資訊。","words":[["confirmation bias","確認偏誤","偏向尋找或重視支持自己原有觀點的資訊。"],["for instance","例如","用來引出具體例子。"],["corroborate","證實、支持（說法或證據）","corroborates our prior convictions 指支持既有信念。"],["prior convictions","原有的堅定信念","conviction 在此指深信不疑的看法，而不是定罪。"],["dismiss","忽略、不予理會","此處表示把不符合原有信念的資訊排除。"],["contradict","與……矛盾、反駁","what contradicts them 指與原有信念相牴觸的事物。"]],"grammar":"主幹是 Confirmation bias leads us to seek evidence。that corroborates... 說明我們偏好哪種證據；while dismissing... 與 seek 形成對比，指出我們同時排斥相反資訊。what contradicts them 指反駁既有信念的內容。"},{"en":"Compounding this, the so-called anchoring effect tethers our judgments to whatever figure we first encounter, however arbitrary.","zh":"更使情況複雜的是，所謂的錨定效應會讓我們的判斷受最先接觸到的數字牽制，不論那個數字有多麼隨意。","words":[["compounding this","使這個問題更加嚴重的是","compound 作動詞可表示加劇問題。"],["the so-called anchoring effect","所謂的錨定效應","指最先接觸的資訊成為後續判斷的參考基準。"],["tether A to B","把 A 繫在／束縛於 B","此處比喻判斷受到初始數字牽制。"],["whatever figure","無論什麼數字","figure 在這裡指數字，不是人物或圖形。"],["encounter","遇到、接觸到","first encounter 指最先看到或接觸到。"],["however arbitrary","無論多麼隨意","however + 形容詞表示「無論多麼……」。"]],"grammar":"句首 Compounding this 表示「更糟的是」，承接上一種偏誤。主幹是 the anchoring effect tethers our judgments to...；whatever figure... 指最先遇到的任何數字，however arbitrary 表示即使那數字毫無根據。"},{"en":"What makes such biases so insidious is that awareness alone seldom loosens their grip; even experts, fully cognizant of the pitfalls, succumb.","zh":"這些偏誤之所以如此難以察覺且危險，是因為單靠意識到它們的存在，往往仍無法擺脫其影響；即使是完全了解其中陷阱的專家，也會受到影響。","words":[["insidious","不易察覺卻逐漸造成傷害的","形容問題隱蔽而難以防範。"],["awareness alone","單憑察覺、只有意識到","alone 強調「光靠這一點」仍不足夠。"],["seldom","很少、難得","頻率副詞，語氣接近 rarely。"],["loosen their grip","減弱它們的控制力","grip 原指緊握，這裡比喻偏誤的影響力。"],["fully cognizant of","充分了解……的","cognizant of 是較正式的「知道、意識到」。"],["pitfalls","陷阱、潛在問題","指容易犯錯或受到誤導的地方。"],["succumb","屈服、無法抵抗","此處指專家也無法完全避免認知偏誤。"]],"grammar":"主詞是 What makes such biases so insidious，整體意思是「使偏誤難纏的原因」；is that... 提出答案：光靠察覺也難擺脫。分號後以 even experts... succumb 補強：連知道陷阱的專家也會中招。"},{"en":"Only by building deliberate safeguards into our institutions and procedures can we hope to temper the worst excesses of intuition with the discipline of evidence.","zh":"唯有在制度與程序中建立刻意設計的防護機制，我們才有希望以證據所要求的嚴謹態度，抑制直覺所造成的最嚴重偏差。","words":[["only by + V-ing","唯有透過……才……","句首使用 Only by 時，主句通常採部分倒裝。"],["deliberate safeguards","刻意設計的防護機制","deliberate 在此表示經過審慎規劃，而非偶然。"],["institutions and procedures","制度與程序","指組織或社會的規範及運作流程。"],["temper","緩和、抑制","這裡不是「脾氣」，而是動詞「減輕某種強烈影響」。"],["the worst excesses of intuition","直覺最嚴重的過度偏差","excesses 指過度或失控的表現。"],["the discipline of evidence","證據所要求的嚴謹態度","強調以可驗證的證據約束直覺判斷。"]],"grammar":"Only by... 放在句首，限制「只有透過什麼方法」，因此後面倒裝為 can we hope。by building... 說明方法是建立防護機制；temper A with B 表示用證據紀律節制直覺的過度影響。"}];
const container=document.getElementById('articles');
for(const [i,s] of data.entries()){
 const section=document.createElement('section');section.className='sentence';
 const num=document.createElement('div');num.className='number';num.textContent='SENTENCE '+String(i+1).padStart(2,'0');section.append(num);
 const en=document.createElement('p');en.className='english';en.textContent=s.en;section.append(en);
 const zh=document.createElement('p');zh.className='translation';zh.textContent=s.zh;section.append(zh);
 const tools=document.createElement('div');tools.className='study-tools';section.append(tools);
 const label=document.createElement('div');label.className='section-label';label.textContent='字詞與片語 · 點選查看';tools.append(label);
 const chips=document.createElement('div');chips.className='chips';tools.append(chips);
 const definition=document.createElement('div');definition.className='definition';definition.hidden=true;definition.setAttribute('aria-live','polite');tools.append(definition);
 let selected=-1;
 for(const [j,w] of s.words.entries()){
  const btn=document.createElement('button');btn.className='chip';btn.type='button';btn.textContent=w[0];btn.setAttribute('aria-pressed','false');
  btn.addEventListener('click',()=>{const same=selected===j;for(const b of chips.querySelectorAll('button'))b.setAttribute('aria-pressed','false');if(same){selected=-1;definition.hidden=true;definition.replaceChildren();return}selected=j;btn.setAttribute('aria-pressed','true');definition.hidden=false;const title=document.createElement('strong');title.textContent=w[0];const meaning=document.createElement('div');meaning.className='meaning';meaning.textContent=w[1];const explanation=document.createElement('p');explanation.textContent=w[2];definition.replaceChildren(title,meaning,explanation)});chips.append(btn)
 }
 const grammar=document.createElement('details');grammar.className='grammar';const summary=document.createElement('summary');summary.textContent='文法與句子邏輯';const content=document.createElement('p');content.textContent=s.grammar;grammar.append(summary,content);tools.append(grammar);container.append(section);
}
const storeKey='readingNotesReaderV2';let settings={size:25,theme:'light',zh:true,pure:false};try{settings={...settings,...JSON.parse(localStorage.getItem(storeKey)||'{}')}}catch(e){}
settings.size=Math.max(21,Math.min(31,Number(settings.size)||25));
const root=document.documentElement,page=document.getElementById('readingPage');
function render(){root.dataset.theme=settings.theme;root.style.setProperty('--english-size',settings.size+'px');root.style.setProperty('--zh-size',Math.round(settings.size*.84)+'px');root.style.setProperty('--chip-size',Math.round(settings.size*.84)+'px');root.style.setProperty('--detail-size',Math.round(settings.size*.8)+'px');document.getElementById('sizeDisplay').textContent=settings.size+'px';document.getElementById('smaller').disabled=settings.size<=21;document.getElementById('larger').disabled=settings.size>=31;document.querySelectorAll('.translation').forEach(el=>el.hidden=!settings.zh||settings.pure);document.querySelectorAll('.study-tools').forEach(el=>el.hidden=settings.pure);page.classList.toggle('pure',settings.pure);const zh=document.getElementById('toggleZh');zh.textContent=settings.zh?'隱藏中文':'顯示中文';zh.setAttribute('aria-pressed',String(!settings.zh));zh.disabled=settings.pure;const pure=document.getElementById('pure');pure.textContent=settings.pure?'返回逐句精讀':'純英文閱讀';pure.setAttribute('aria-pressed',String(settings.pure));const theme=document.getElementById('theme');theme.textContent=settings.theme==='dark'?'淺色模式':'深色模式';theme.setAttribute('aria-pressed',String(settings.theme==='dark'));try{localStorage.setItem(storeKey,JSON.stringify(settings))}catch(e){}}
document.getElementById('smaller').addEventListener('click',()=>{settings.size=Math.max(21,settings.size-2);render()});document.getElementById('larger').addEventListener('click',()=>{settings.size=Math.min(31,settings.size+2);render()});document.getElementById('toggleZh').addEventListener('click',()=>{settings.zh=!settings.zh;render()});document.getElementById('pure').addEventListener('click',()=>{settings.pure=!settings.pure;render()});document.getElementById('theme').addEventListener('click',()=>{settings.theme=settings.theme==='light'?'dark':'light';render()});render();
</script></body></html>

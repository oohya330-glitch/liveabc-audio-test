*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.shell{max-width:980px;margin:0 auto;padding:26px 34px 70px}.reader{max-width:850px;margin:0 auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:4px 0 20px}.eyebrow{font-size:13px;font-weight:700;letter-spacing:1.4px;color:var(--secondary)}h1{font-size:clamp(28px,3.2vw,37px);line-height:1.3;margin:9px 0 5px;letter-spacing:-.02em}.subtitle{color:var(--secondary);font-size:17px}.toolbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;margin-bottom:10px}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.control{border:1px solid var(--chip-border);background:var(--paper);border-radius:9px;padding:10px 12px;min-height:46px;font-size:16px;font-weight:700}.control[aria-pressed=true]{background:var(--selected);color:var(--selected-text);border-color:var(--selected)}.font-size-label{font-size:15px;min-width:52px;text-align:center;color:var(--secondary);font-variant-numeric:tabular-nums}.count{font-size:15px;color:var(--secondary)}.reading-page{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:30px clamp(22px,5vw,60px) 48px}.sentence{padding:29px 0 35px;border-bottom:1px solid var(--line)}.sentence:first-child{padding-top:8px}.sentence:last-child{border-bottom:0;padding-bottom:12px}.number{font-size:13px;font-weight:700;letter-spacing:1.1px;color:var(--secondary);margin-bottom:15px}.english{font-family:Arial,sans-serif;font-size:var(--english-size);line-height:1.72;font-weight:500;color:var(--ink);margin:0 0 16px;overflow-wrap:break-word}.translation{font-size:var(--zh-size);line-height:1.78;color:var(--secondary);margin:0 0 21px}.translation[hidden],.study-tools[hidden]{display:none!important}.section-label{font-size:16px;font-weight:700;color:var(--secondary);margin:0 0 12px}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{background:var(--chip);border:1.5px solid var(--chip-border);border-radius:9px;padding:10px 14px;min-height:48px;font-family:Arial,sans-serif;font-size:var(--chip-size);line-height:1.4;font-weight:700;text-align:left}.chip[aria-pressed=true]{background:var(--selected);color:var(--selected-text);border-color:var(--selected)}.definition{background:var(--definition);border-left:3px solid var(--accent);margin-top:14px;padding:17px 19px;border-radius:3px 9px 9px 3px;font-size:var(--detail-size);line-height:1.7}.definition[hidden]{display:none}.definition strong{display:block;margin-bottom:5px}.definition .meaning{font-weight:700}.definition p{margin:7px 0 0}.grammar{margin-top:20px;border-top:1px solid var(--line)}.grammar summary{padding:16px 2px 8px;cursor:pointer;font-size:18px;font-weight:700;list-style:none;display:flex;justify-content:space-between}.grammar summary::-webkit-details-marker{display:none}.grammar summary:after{content:'＋'}.grammar[open] summary:after{content:'−'}.grammar p{margin:4px 0 8px;padding:4px 2px;font-size:var(--detail-size);line-height:1.8;color:var(--secondary)}.closing{margin:34px 0 0;padding:24px 0 0;border-top:1px solid var(--line)}.closing h2{font-size:23px;margin:0 0 10px}.closing p{font-size:var(--detail-size);line-height:1.8;margin:0}footer{font-size:13px;color:var(--secondary);text-align:center;margin-top:26px}.pure .sentence{padding-top:25px;padding-bottom:25px}.pure .english{margin:0}.pure .sentence{border:0}.pure .number{display:none}.pure .sentence:first-child{padding-top:0}.pure .closing{display:none}

.library-return{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:10px 14px;border:1px solid var(--chip-border);border-radius:9px;background:var(--paper);color:var(--ink);font-size:16px;font-weight:700;text-decoration:none}.library-return:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.library-return:hover{border-color:var(--accent)}.library-return-bottom{margin-top:24px;text-align:center}</style></head><body><main class="shell"><div class="reader"><nav aria-label="返回書庫" style="margin:0 0 16px"><a class="library-return" href="library/">← 返回閱讀書庫</a></nav><header class="top"><div><div class="eyebrow">ENGLISH READING NOTES · 01</div><h1>The Paradox of Choice</h1><div class="subtitle">選擇的弔詭 · 逐句精讀</div></div></header><nav class="toolbar" aria-label="閱讀設定"><div class="count">全文 5 句 · 點選字詞查看解析</div><div class="controls"><button class="control" id="smaller" aria-label="縮小字體">A−</button><span class="font-size-label" id="sizeDisplay">25px</span><button class="control" id="larger" aria-label="放大字體">A+</button><button class="control" id="toggleZh" aria-pressed="false">隱藏中文</button><button class="control" id="pure" aria-pressed="false">純英文閱讀</button><button class="control" id="theme" aria-pressed="false">深色模式</button></div></nav><article class="reading-page" id="readingPage"><div id="articles"></div><section class="closing"><h2>全文主旨</h2><p>選擇越多不一定越好。過多選項可能造成決策困難、焦慮與遺憾。因此，學會接受「足夠好」的選擇，有時比不斷追求最佳選擇更能帶來滿足感。</p></section></article><div class="library-return-bottom"><a class="library-return" href="library/">← 返回閱讀書庫</a></div><footer>READING NOTES · PERSONAL STUDY EDITION</footer></div></main><script>
const data=[{"en":"Conventional wisdom holds that an abundance of options invariably enhances consumer welfare, yet a growing body of research suggests the opposite.","zh":"傳統觀念認為，豐富多樣的選擇必然能提升消費者的福祉，然而，越來越多的研究卻指出，事實恰恰相反。","words":[["conventional wisdom","傳統觀念、普遍接受的看法","wisdom 在這裡不是個人的智慧，而是社會普遍認同的觀點。"],["hold that","認為、主張……","hold 在這裡表示持有某種觀點，不是「拿著」。"],["an abundance of","大量的、豐富的","此處強調市場提供的選項很多。"],["invariably","總是、一貫地、必然地","用來強調傳統觀念認為選擇越多必然越好。"],["enhance","提升、增進","enhance consumer welfare 指增進消費者福祉。"],["a growing body of research","日益累積的研究成果","body 在這裡指一整套相關研究，不是「身體」。"]],"grammar":"主句是 Conventional wisdom holds that...；yet 轉向研究提出的相反結論。兩個 that 子句分別交代傳統看法與研究發現，形成「一般認為如此，證據卻顯示相反」的對照。"},{"en":"When confronted with an overwhelming array of alternatives, individuals frequently experience a kind of paralysis that undermines their capacity to commit.","zh":"當人們面對多到令人不知所措的各種選項時，往往會陷入一種難以做出決定的僵局，進而削弱他們下定決心的能力。","words":[["be confronted with","面臨、面對","通常用來描述面對問題、挑戰或需要處理的情況。"],["an overwhelming array of","多到令人不知所措的一系列","overwhelming 強調數量或程度超出負荷；array 指一系列。"],["alternatives","可供選擇的方案、選項","在這裡與 options 意思相近。"],["paralysis","癱瘓；此處指決策停滯","比喻因選擇太多而無法做出決定。"],["undermine","削弱、損害","常指逐漸削弱能力、信心或基礎。"],["capacity to commit","做出明確選擇並投入其中的能力","commit 在此指下定決心並做出承諾，不是「犯罪」。"]],"grammar":"句首 When confronted with... 省略 individuals are，表示「當人們面對……時」。主句說人們會陷入決策停滯；that undermines... 再說明這種停滯如何削弱做決定的能力。"},{"en":"Paradoxically, the very freedom that markets celebrate can curdle into a source of anxiety, as each unchosen possibility lingers as a phantom regret.","zh":"矛盾的是，市場大力推崇的選擇自由，反而可能逐漸變成焦慮的來源，因為每一個未被選中的可能性，都會像揮之不去的假想遺憾一樣留在人們心中。","words":[["paradoxically","矛盾的是、看似違反常理的是","指出結果與一般預期相反。"],["the very freedom","正是這種自由","very 在此用來強調名詞，不是「非常」。"],["celebrate","推崇、讚揚","此處不是慶祝活動，而是指市場推崇選擇自由。"],["curdle into","逐漸變質成、轉變成","原指液體凝結或變質；這裡比喻自由轉變成焦慮。"],["linger","持續存在、久久不散","常用於情緒、記憶等不容易消失的事物。"],["phantom regret","假想的遺憾","對未選擇的可能性產生的後悔，即使結果未真正發生。"]],"grammar":"主詞是 the very freedom，that markets celebrate 補充「市場推崇的」自由。can curdle into 說明自由竟會變成焦慮；as 子句進一步解釋：沒選的可能性會留下遺憾。"},{"en":"This phenomenon, often attributed to the psychologist Barry Schwartz, reveals that satisfaction depends less on the breadth of choice than on the ease with which a decision can be reached.","zh":"這種現象通常被認為與心理學家巴里・施瓦茨有關，它揭示了：滿足感與其說取決於選擇的多寡，不如說取決於做出決定是否容易。","words":[["phenomenon","現象","此處指選擇過多反而造成決策困難與焦慮。複數為 phenomena。"],["be attributed to","被歸因於、被認為與……有關","本文將這種現象與心理學家 Barry Schwartz 聯繫起來。"],["satisfaction","滿足感、滿意程度","指人們對所做選擇的滿意程度。"],["the breadth of choice","選擇的廣度、選項的多寡","breadth 原指寬度，這裡表示可選範圍。"],["reach a decision","做出決定、達成決定","reach 在此表示經過思考得出決定，不是實際抵達某處。"]],"grammar":"主幹是 This phenomenon reveals that...，中間 often attributed to... 補充這種現象與哪位學者有關。less on A than on B 強調滿足感更取決於決策是否容易，而非選項多寡。"},{"en":"Insofar as modern life proliferates options at every turn, the wise consumer learns to impose arbitrary limits on deliberation, trading the illusion of optimal selection for the relief of a sufficient one.","zh":"由於現代生活處處充斥著越來越多的選擇，明智的消費者會學著為自己的思考與權衡設定人為的限制，放棄追求最佳選擇的幻想，轉而接受一個已經足夠好的選擇，從中獲得輕鬆與安心。","words":[["insofar as","在……範圍內；此處可理解為「鑑於」","用來限定陳述成立的範圍，此處帶有說明背景的意味。"],["proliferate","迅速增加、大量出現","此處指現代生活中的選擇越來越多。"],["at every turn","處處、隨時隨地","表示在各種情況或生活各個角落。"],["impose limits on","對……設定限制","這裡是主動為自己的決策過程設定界限。"],["arbitrary limits","人為設定的界限","arbitrary 可指任意決定的，此處不一定表示不合理。"],["deliberation","仔細思考、反覆權衡","做決定之前的慎重考慮過程。"],["trade A for B","放棄 A 以換取 B","放棄追求完美的幻想，換取接受足夠好選擇的安心。"],["optimal selection","最佳選擇","optimal 指在特定條件下最理想的。"],["a sufficient one","一個足夠好的選擇","one 代替前面的 selection。"]],"grammar":"句首 Insofar as... 交代選項氾濫的背景。主幹是 the wise consumer learns to impose limits...；句尾 trading A for B 說明這種做法的取捨：放棄最佳幻想，換取足夠好的安心。"}];
const container=document.getElementById('articles');
for(const [i,s] of data.entries()){
 const section=document.createElement('section');section.className='sentence';
 const num=document.createElement('div');num.className='number';num.textContent='SENTENCE '+String(i+1).padStart(2,'0');section.append(num);
 const en=document.createElement('p');en.className='english';en.textContent=s.en;section.append(en);
 const zh=document.createElement('p');zh.className='translation';zh.textContent=s.zh;section.append(zh);
 const tools=document.createElement('div');tools.className='study-tools';section.append(tools);
 const label=document.createElement('div');label.className='section-label';label.textContent='字詞與片語 · 點選查看';tools.append(label);
 const chips=document.createElement('div');chips.className='chips';tools.append(chips);
 const definition=document.createElement('div');definition.className='definition';definition.hidden=true;definition.setAttribute('aria-live','polite');tools.append(definition);
 let selected=-1;
 for(const [j,w] of s.words.entries()){
  const btn=document.createElement('button');btn.className='chip';btn.type='button';btn.textContent=w[0];btn.setAttribute('aria-pressed','false');
  btn.addEventListener('click',()=>{const same=selected===j;for(const b of chips.querySelectorAll('button'))b.setAttribute('aria-pressed','false');if(same){selected=-1;definition.hidden=true;definition.replaceChildren();return}selected=j;btn.setAttribute('aria-pressed','true');definition.hidden=false;const title=document.createElement('strong');title.textContent=w[0];const meaning=document.createElement('div');meaning.className='meaning';meaning.textContent=w[1];const explanation=document.createElement('p');explanation.textContent=w[2];definition.replaceChildren(title,meaning,explanation)});chips.append(btn)
 }
 const grammar=document.createElement('details');grammar.className='grammar';const summary=document.createElement('summary');summary.textContent='文法與句子邏輯';const content=document.createElement('p');content.textContent=s.grammar;grammar.append(summary,content);tools.append(grammar);container.append(section);
}
const storeKey='readingNotesReaderV2';let settings={size:25,theme:'light',zh:true,pure:false};try{settings={...settings,...JSON.parse(localStorage.getItem(storeKey)||'{}')}}catch(e){}
settings.size=Math.max(21,Math.min(31,Number(settings.size)||25));
const root=document.documentElement,page=document.getElementById('readingPage');
function render(){root.dataset.theme=settings.theme;root.style.setProperty('--english-size',settings.size+'px');root.style.setProperty('--zh-size',Math.round(settings.size*.84)+'px');root.style.setProperty('--chip-size',Math.round(settings.size*.84)+'px');root.style.setProperty('--detail-size',Math.round(settings.size*.8)+'px');document.getElementById('sizeDisplay').textContent=settings.size+'px';document.getElementById('smaller').disabled=settings.size<=21;document.getElementById('larger').disabled=settings.size>=31;document.querySelectorAll('.translation').forEach(el=>el.hidden=!settings.zh||settings.pure);document.querySelectorAll('.study-tools').forEach(el=>el.hidden=settings.pure);page.classList.toggle('pure',settings.pure);const zh=document.getElementById('toggleZh');zh.textContent=settings.zh?'隱藏中文':'顯示中文';zh.setAttribute('aria-pressed',String(!settings.zh));zh.disabled=settings.pure;const pure=document.getElementById('pure');pure.textContent=settings.pure?'返回逐句精讀':'純英文閱讀';pure.setAttribute('aria-pressed',String(settings.pure));const theme=document.getElementById('theme');theme.textContent=settings.theme==='dark'?'淺色模式':'深色模式';theme.setAttribute('aria-pressed',String(settings.theme==='dark'));try{localStorage.setItem(storeKey,JSON.stringify(settings))}catch(e){}}
document.getElementById('smaller').addEventListener('click',()=>{settings.size=Math.max(21,settings.size-2);render()});document.getElementById('larger').addEventListener('click',()=>{settings.size=Math.min(31,settings.size+2);render()});document.getElementById('toggleZh').addEventListener('click',()=>{settings.zh=!settings.zh;render()});document.getElementById('pure').addEventListener('click',()=>{settings.pure=!settings.pure;render()});document.getElementById('theme').addEventListener('click',()=>{settings.theme=settings.theme==='light'?'dark':'light';render()});render();
</script></body></html>

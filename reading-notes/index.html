<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Notes 01 · The Paradox of Choice</title><style>:root{--ink:#282437;--muted:#736d82;--purple:#7451aa;--line:#e7def2;--bg:#faf8fe;--pale:#f1ebfa;--chip:#e7daf7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,'Noto Sans TC','Microsoft JhengHei',sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:850px;margin:auto;padding:28px 18px 64px}header{padding:12px 4px 24px}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--purple);font-weight:700}h1{font-size:clamp(26px,5vw,38px);margin:10px 0 7px;line-height:1.25}.sub{color:var(--muted);font-size:15px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 22px}.count{color:var(--muted);font-size:14px}button{font-family:inherit;cursor:pointer}button:focus-visible{outline:3px solid #a68add;outline-offset:3px}.toggle{background:white;color:#4b376b;border:1px solid #d8c8ed;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:700}.sentence{background:white;border:1px solid var(--line);border-radius:19px;padding:25px;margin:18px 0;box-shadow:0 5px 20px rgba(78,48,113,.045)}.number{font-size:12px;font-weight:700;letter-spacing:1.4px;color:#8b72b2;margin-bottom:13px}.english{font-family:Arial,sans-serif;font-size:19px;line-height:1.8;font-weight:400;color:#202027;margin:0 0 18px}.translation{background:var(--pale);border-radius:12px;padding:16px 18px;font-size:17px;line-height:1.85;color:#353044;margin-bottom:20px}.translation.hidden{display:none}.section-label{font-size:14px;font-weight:700;color:#625777;margin-bottom:11px}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{border:1.5px solid #c7b2e6;background:var(--chip);border-radius:11px;padding:12px 14px;color:#272232;font-size:16px;line-height:1.3;font-weight:700;min-height:45px;transition:background .15s,border-color .15s}.chip:hover{background:#d9c7f1}.chip[aria-pressed=true]{background:#7352a5;color:#fff;border-color:#7352a5}.definition{background:#f8f4fd;border-left:4px solid #a487d0;border-radius:11px;margin-top:14px;padding:16px 18px;line-height:1.7}.definition[hidden]{display:none}.definition strong{display:block;font-size:17px;margin-bottom:4px}.definition .meaning{font-weight:700;font-size:16px}.definition p{margin:6px 0 0;font-size:15px;color:#4c4559}.grammar{margin-top:19px;border:1px solid #e4d8f1;border-radius:12px;overflow:hidden}.grammar summary{padding:14px 16px;cursor:pointer;font-size:15px;font-weight:700;color:#55436c;list-style:none;display:flex;justify-content:space-between}.grammar summary::-webkit-details-marker{display:none}.grammar summary:after{content:'＋';font-size:20px;line-height:1}.grammar[open] summary:after{content:'−'}.grammar p{border-top:1px solid #e4d8f1;margin:0;padding:15px 16px;font-size:15px;line-height:1.8}.summary{margin-top:24px;padding:23px;background:#eee6f8;border-radius:16px;line-height:1.8}.summary h2{font-size:18px;margin:0 0 7px}.summary p{margin:0;font-size:16px}footer{text-align:center;color:#8c8298;font-size:12px;margin-top:26px}@media(max-width:550px){.wrap{padding:20px 12px 48px}.sentence{padding:20px 16px;border-radius:16px}.english{font-size:18px}.translation{font-size:16px;padding:14px}.chip{font-size:16px;padding:11px 13px}.toolbar{margin:8px 0 16px}}</style></head><body><main class="wrap"><header><div class="eyebrow">ENGLISH READING NOTES · 01</div><h1>The Paradox of Choice</h1><div class="sub">選擇的弔詭 · 逐句精讀</div></header><div class="toolbar"><span class="count">全文 5 句 · 點選字詞查看解析</span><button class="toggle" id="toggleZh" aria-pressed="false">隱藏中文</button></div><div id="articles"></div><section class="summary"><h2>全文主旨</h2><p>選擇越多不一定越好。過多選項可能造成決策困難、焦慮與遺憾。因此，學會接受「足夠好」的選擇，有時比不斷追求最佳選擇更能帶來滿足感。</p></section><footer>READING NOTES · PERSONAL STUDY EDITION</footer></main><script>
const data=[
{en:'Conventional wisdom holds that an abundance of options invariably enhances consumer welfare, yet a growing body of research suggests the opposite.',zh:'傳統觀念認為，豐富多樣的選擇必然能提升消費者的福祉，然而，越來越多的研究卻指出，事實恰恰相反。',words:[['conventional wisdom','傳統觀念、普遍接受的看法','wisdom 在這裡不是個人的智慧，而是社會普遍認同的觀點。'],['hold that','認為、主張……','hold 在這裡表示持有某種觀點，不是「拿著」。'],['an abundance of','大量的、豐富的','此處強調市場提供的選項很多。'],['invariably','總是、一貫地、必然地','用來強調傳統觀念認為選擇越多必然越好。'],['enhance','提升、增進','enhance consumer welfare 指增進消費者福祉。'],['a growing body of research','日益累積的研究成果','body 在這裡指一整套相關研究，不是「身體」。']],grammar:'holds that 與 suggests 後面都接表達觀點的名詞子句。yet 表示轉折：傳統觀念認為選擇越多越好，但研究卻指出相反結果。'},
{en:'When confronted with an overwhelming array of alternatives, individuals frequently experience a kind of paralysis that undermines their capacity to commit.',zh:'當人們面對多到令人不知所措的各種選項時，往往會陷入一種難以做出決定的僵局，進而削弱他們下定決心的能力。',words:[['be confronted with','面臨、面對','通常用來描述面對問題、挑戰或需要處理的情況。'],['an overwhelming array of','多到令人不知所措的一系列','overwhelming 強調數量或程度超出負荷；array 指一系列。'],['alternatives','可供選擇的方案、選項','在這裡與 options 意思相近。'],['paralysis','癱瘓；此處指決策停滯','比喻因選擇太多而無法做出決定。'],['undermine','削弱、損害','常指逐漸削弱能力、信心或基礎。'],['capacity to commit','做出明確選擇並投入其中的能力','commit 在此指下定決心並做出承諾，不是「犯罪」。']],grammar:'When confronted with... 是 When individuals are confronted with... 的省略形式。that undermines their capacity to commit 是修飾 paralysis 的關係子句。'},
{en:'Paradoxically, the very freedom that markets celebrate can curdle into a source of anxiety, as each unchosen possibility lingers as a phantom regret.',zh:'矛盾的是，市場大力推崇的選擇自由，反而可能逐漸變成焦慮的來源，因為每一個未被選中的可能性，都會像揮之不去的假想遺憾一樣留在人們心中。',words:[['paradoxically','矛盾的是、看似違反常理的是','指出結果與一般預期相反。'],['the very freedom','正是這種自由','very 在此用來強調名詞，不是「非常」。'],['celebrate','推崇、讚揚','此處不是慶祝活動，而是指市場推崇選擇自由。'],['curdle into','逐漸變質成、轉變成','原指液體凝結或變質；這裡比喻自由轉變成焦慮。'],['linger','持續存在、久久不散','常用於情緒、記憶等不容易消失的事物。'],['phantom regret','假想的遺憾','對未選擇的可能性產生的後悔，即使結果未真正發生。']],grammar:'that markets celebrate 修飾 freedom。as 在此表示原因，說明為何自由可能轉變成焦慮。'},
{en:'This phenomenon, often attributed to the psychologist Barry Schwartz, reveals that satisfaction depends less on the breadth of choice than on the ease with which a decision can be reached.',zh:'這種現象通常被認為與心理學家巴里・施瓦茨有關，它揭示了：滿足感與其說取決於選擇的多寡，不如說取決於做出決定是否容易。',words:[['phenomenon','現象','此處指選擇過多反而造成決策困難與焦慮。複數為 phenomena。'],['be attributed to','被歸因於、被認為與……有關','本文將這種現象與心理學家 Barry Schwartz 聯繫起來。'],['satisfaction','滿足感、滿意程度','指人們對所做選擇的滿意程度。'],['the breadth of choice','選擇的廣度、選項的多寡','breadth 原指寬度，這裡表示可選範圍。'],['reach a decision','做出決定、達成決定','reach 在此表示經過思考得出決定，不是實際抵達某處。']],grammar:'depend less on A than on B 表示「與其說取決於 A，不如說更取決於 B」。with which a decision can be reached 修飾 ease，意思是「做出決定的容易程度」。'},
{en:'Insofar as modern life proliferates options at every turn, the wise consumer learns to impose arbitrary limits on deliberation, trading the illusion of optimal selection for the relief of a sufficient one.',zh:'由於現代生活處處充斥著越來越多的選擇，明智的消費者會學著為自己的思考與權衡設定人為的限制，放棄追求最佳選擇的幻想，轉而接受一個已經足夠好的選擇，從中獲得輕鬆與安心。',words:[['insofar as','在……範圍內；此處可理解為「鑑於」','用來限定陳述成立的範圍，此處帶有說明背景的意味。'],['proliferate','迅速增加、大量出現','此處指現代生活中的選擇越來越多。'],['at every turn','處處、隨時隨地','表示在各種情況或生活各個角落。'],['impose limits on','對……設定限制','這裡是主動為自己的決策過程設定界限。'],['arbitrary limits','人為設定的界限','arbitrary 可指任意決定的，此處不一定表示不合理。'],['deliberation','仔細思考、反覆權衡','做決定之前的慎重考慮過程。'],['trade A for B','放棄 A 以換取 B','放棄追求完美的幻想，換取接受足夠好選擇的安心。'],['optimal selection','最佳選擇','optimal 指在特定條件下最理想的。'],['a sufficient one','一個足夠好的選擇','one 代替前面的 selection。']],grammar:'Insofar as 引導背景說明。主句是 the wise consumer learns to impose arbitrary limits on deliberation。trading... 是現在分詞片語，補充說明消費者如何取捨。'}];
const container=document.getElementById('articles');data.forEach((s,i)=>{const section=document.createElement('section');section.className='sentence';const num=document.createElement('div');num.className='number';num.textContent='SENTENCE '+String(i+1).padStart(2,'0');section.append(num);const en=document.createElement('p');en.className='english';en.textContent=s.en;section.append(en);const zh=document.createElement('div');zh.className='translation';zh.textContent=s.zh;section.append(zh);const label=document.createElement('div');label.className='section-label';label.textContent='字詞與片語 · 點選查看';section.append(label);const chips=document.createElement('div');chips.className='chips';section.append(chips);const definition=document.createElement('div');definition.className='definition';definition.hidden=true;definition.setAttribute('aria-live','polite');section.append(definition);let selected=-1;s.words.forEach((w,j)=>{const btn=document.createElement('button');btn.className='chip';btn.type='button';btn.textContent=w[0];btn.setAttribute('aria-pressed','false');btn.addEventListener('click',()=>{const isSame=selected===j;chips.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));if(isSame){selected=-1;definition.hidden=true;definition.replaceChildren();return}selected=j;btn.setAttribute('aria-pressed','true');definition.hidden=false;const title=document.createElement('strong');title.textContent=w[0];const meaning=document.createElement('div');meaning.className='meaning';meaning.textContent=w[1];const explanation=document.createElement('p');explanation.textContent=w[2];definition.replaceChildren(title,meaning,explanation)});chips.append(btn)});const grammar=document.createElement('details');grammar.className='grammar';const summary=document.createElement('summary');summary.textContent='文法與句子邏輯';const content=document.createElement('p');content.textContent=s.grammar;grammar.append(summary,content);section.append(grammar);container.append(section)});let hidden=false;document.getElementById('toggleZh').addEventListener('click',e=>{hidden=!hidden;document.querySelectorAll('.translation').forEach(el=>el.classList.toggle('hidden',hidden));e.currentTarget.textContent=hidden?'顯示中文':'隱藏中文';e.currentTarget.setAttribute('aria-pressed',String(hidden))});
</script></body></html>
